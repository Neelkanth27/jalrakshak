services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: jalrakshak-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"   # Standard MQTT for ESP32 & Backend
      - "9001:9001"   # WebSockets for browser clients
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  ingestion-api:
    build:
      context: ../services/ingestion-api
      dockerfile: Dockerfile
    container_name: jalrakshak-ingestion-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - MQTT_TELEMETRY_TOPIC=${MQTT_TELEMETRY_TOPIC:-jalrakshak/telemetry}
      - MQTT_ALERTS_TOPIC=${MQTT_ALERTS_TOPIC:-jalrakshak/alerts}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Kolkata}
      - DEVICE_API_KEY=${DEVICE_API_KEY:-jal_sec_dev_local_key}
    depends_on:
      - mqtt-broker

  alert-worker:
    build:
      context: ../services/alert-worker
      dockerfile: Dockerfile
    container_name: jalrakshak-alert-worker
    restart: unless-stopped
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - MQTT_ALERTS_TOPIC=${MQTT_ALERTS_TOPIC:-jalrakshak/alerts}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Kolkata}
    depends_on:
      - mqtt-broker

  dashboard-ui:
    build:
      context: ../services/dashboard-ui
      dockerfile: Dockerfile
    container_name: jalrakshak-dashboard-ui
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - ingestion-api
