# Eclipse Mosquitto Configuration for JalRakshak
# Allows local LAN connections from ESP32 DevKit V1 and Docker services

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Standard MQTT Port for ESP32 & Backend Microservices
listener 1883
allow_anonymous true

# WebSockets Port for Browser Clients
listener 9001
protocol websockets
allow_anonymous true
